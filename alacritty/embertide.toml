# EmberTide — dark terminal theme for Alacritty
# Save as ~/.config/alacritty/themes/embertide.toml, then in alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/embertide.toml"]
# Generated by scripts/build.py — do not hand-edit.

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#001219"
foreground = "#e9d8a6"

[colors.cursor]
text = "#001219"
cursor = "#ee9b00"

[colors.selection]
text = "#e9d8a6"
background = "#4376c2"

[colors.normal]
black   = "#001219"
red     = "#c23626"
green   = "#199647"
yellow  = "#ee9b00"
blue    = "#00b4d8"
magenta = "#ab51e3"
cyan    = "#008388"
white   = "#e9d8a6"

[colors.bright]
black   = "#6d787c"
red     = "#da5b2d"
green   = "#8fe259"
yellow  = "#febd5c"
blue    = "#0ad6ff"
magenta = "#cf76ff"
cyan    = "#65dcb9"
white   = "#f6ebca"
