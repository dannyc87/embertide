# EmberTide (Reef) — dark terminal theme for Alacritty
# Save as ~/.config/alacritty/themes/embertide.toml, then in alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/embertide.toml"]
# Generated by scripts/build.py — do not hand-edit.

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#001219"
foreground = "#e9d8a6"

[colors.cursor]
text = "#001219"
cursor = "#ee9b00"

[colors.selection]
text = "#e9d8a6"
background = "#005f73"

[colors.normal]
black   = "#001219"
red     = "#c23626"
green   = "#387729"
yellow  = "#ee9b00"
blue    = "#006faa"
magenta = "#9b4e8c"
cyan    = "#0a9396"
white   = "#e9d8a6"

[colors.bright]
black   = "#384f57"
red     = "#da5b2d"
green   = "#519143"
yellow  = "#e9d8a6"
blue    = "#1c8ac7"
magenta = "#b767a7"
cyan    = "#94d2bd"
white   = "#e9d8a6"
