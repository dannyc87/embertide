# EmberTide Light — light terminal theme for Alacritty
# Save as ~/.config/alacritty/themes/embertide-light.toml, then in alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/embertide-light.toml"]
# Generated by scripts/build.py — do not hand-edit.

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#faf3e0"
foreground = "#001219"

[colors.cursor]
text = "#001219"
cursor = "#a8701c"

[colors.selection]
text = "#001219"
background = "#b6d0f6"

[colors.normal]
black   = "#faf3e0"
red     = "#d33120"
green   = "#199245"
yellow  = "#a8701c"
blue    = "#137289"
magenta = "#ba3eff"
cyan    = "#008d92"
white   = "#1c3139"

[colors.bright]
black   = "#7d888d"
red     = "#ab3803"
green   = "#2b5506"
yellow  = "#845800"
blue    = "#0e596a"
magenta = "#861ab4"
cyan    = "#006f57"
white   = "#001219"
